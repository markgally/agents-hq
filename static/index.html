<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENTS HQ</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header id="top">
  <h1><img src="/icon.svg" alt="" width="28" height="28"><span>AGENTS HQ</span></h1>
  <span class="sub" id="hint">Click an agent to open its workspace</span>
  <button id="connPill" class="conn connecting" type="button" title="Codex connection. Click for details."><i></i><span id="connText">Connecting</span></button>
  <span class="testmode" id="testMode" hidden title="AGENTS HQ was started with the mock Codex server. No AI is used and replies are canned.">TEST MODE: no AI</span>
  <span class="grow"></span>
  <button id="goBtn" class="go" type="button" disabled>&#9654; Run Everything</button>
  <button id="stopBatchBtn" type="button" hidden title="Stop the tasks started by Run Everything">&#9632; Stop Batch</button>
  <span class="tz" id="tzBox" title="Schedules use this time zone"><span id="tzName">Asia/Manila</span> <b id="tzClock"></b></span>
  <button id="viewBtn" type="button" title="Switch between the office and the canvas">Canvas View</button>
  <button id="howBtn" type="button">? How to Use</button>
  <button id="setupBtn" type="button">Setup Guide</button>
  <button id="codexBtn" type="button">Codex Integration</button>
</header>

<div class="banner" id="linkBanner" hidden></div>

<div class="main">
  <div id="bw">
    <div id="board">
      <div class="cbar"><b></b><b></b><b></b><span id="boardLabel">Canvas</span></div>
      <div id="office" aria-label="Office view"></div>
      <svg id="wires" aria-hidden="true"></svg>
      <div class="btools">
        <button type="button" id="teamBtn" title="Apply a ready-made team">Team presets</button>
        <button type="button" id="collabBtn" title="Optional hand-offs between agents">Collaboration</button>
        <button type="button" id="tidyBtn" title="Put every card back in its place. Nothing is deleted.">Tidy up</button>
      </div>
      <div id="nodes"></div>
      <div id="panel" role="dialog" aria-label="Agent workspace"></div>
    </div>
  </div>

  <aside class="card" id="side">
    <div class="hd">
      <div><b>Bot Log</b><small id="logSub">live updates</small></div>
      <div class="faces" id="faces"></div>
    </div>
    <div class="cc" id="cc" aria-label="Command Center"></div>
    <div class="lf" id="logFilters" role="tablist"></div>
    <div id="feed"><div class="empty">No activity yet.</div></div>
    <div class="sfoot">
      <button type="button" id="outputsBtn">All outputs</button>
      <button type="button" id="connectorsBtn">Integrations</button>
      <button type="button" id="settingsBtn">Settings</button>
    </div>
  </aside>
</div>

<nav id="dock" class="card" aria-label="Agent launcher">
  <div class="dock-label">Agents</div>
  <div id="dockTiles" class="dock-tiles"></div>
</nav>

<div class="shade" id="panelShade" hidden></div>

<div class="guide" id="dlg" hidden>
  <div class="gcard" id="dlgCard" role="dialog" aria-modal="true">
    <div class="ghead"><div><b id="dlgTitle"></b><span id="dlgSub"></span></div><button id="dlgClose" type="button" aria-label="Close">&#10005;</button></div>
    <div id="dlgBody"></div>
    <div class="gfoot" id="dlgFoot"></div>
  </div>
</div>

<div class="guide top" id="cfm" hidden>
  <div class="gcard small" role="alertdialog" aria-modal="true">
    <b id="cfmT" class="cfmt"></b>
    <p id="cfmP" class="cfmp"></p>
    <div id="cfmX"></div>
    <div class="row end"><button id="cfmNo" type="button">Cancel</button><button class="pri" id="cfmYes" type="button">Confirm</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="/js/util.js"></script>
<script src="/js/markdown.js"></script>
<script src="/js/store.js"></script>
<script src="/js/office.js"></script>
<script src="/js/board.js"></script>
<script src="/js/panel.js"></script>
<script src="/js/log.js"></script>
<script src="/js/dialogs.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
